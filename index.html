<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="background-color: rgb(74, 194, 241);">

    <h1 style="color: rgb(156, 31, 104); text-align: center; margin-top: 50px;">
        type something..........
    </h1>

<input id="greeting" placeholder="type something...."
style="height: 80px; width:80%; margin: 20px auto; display:block; background-color: rgb(188, 225, 235);">

<div style="display:flex; flex-direction:column; align-items:center; ">
    <p style="font-size: 40px;">BOLD</p>
    <p id="text" style="margin-top:10px; font-weight: bold; font-size: 20px;"></p>
</div>

<div style="display:flex; flex-direction:column; align-items:center; ">
    <p style="font-size: 40px;">ITALIC</p>
    <p id="content" style="margin-top:10px; font-style: italic; font-size: 20px;"></p>
</div>

<div style="display:flex; flex-direction:column; align-items:center;">
    <p style="font-size: 40px;">UNDERLINE</p>
    <p id="con" style="margin-top:10px; font-size: 20px; text-decoration: underline;"></p>
</div>

<script>
let greet = document.getElementById("greeting");
let text = document.getElementById("text");
let content = document.getElementById("content");
let con = document.getElementById("con");

greet.addEventListener("input", function () {
    text.textContent = greet.value;
    content.textContent = greet.value;
    con.textContent = greet.value;
});
</script>

</body>
</html>
